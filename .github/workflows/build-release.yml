name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist/LIFT-windows-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "build/Release/LIFT.exe" -Destination $dist
          Copy-Item README.md, LICENSE, handjet.ttf -Destination $dist
          Copy-Item textures, sounds -Destination $dist -Recurse
          Compress-Archive -Path "$dist/*" -DestinationPath "dist/LIFT-windows-x64.zip" -Force
          Get-ChildItem -Recurse $dist | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/LIFT-windows-x64.zip
          if-no-files-found: error

  web:
    name: Web (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache: true

      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DPLATFORM=Web

      - name: Build
        run: cmake --build build-web --parallel

      - name: Package
        run: |
          set -e
          ls -la build-web
          mkdir -p dist/web
          cp build-web/index.html build-web/index.js build-web/index.wasm build-web/index.data dist/web/
          cp README.md LICENSE dist/web/
          cd dist/web
          zip -9 -r ../LIFT-web.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/LIFT-web.zip
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  pages:
    name: GitHub Pages
    needs: web
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: GitHub Release
    needs: [windows, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd dist
          ls -lah
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            LIFT-windows-x64.zip LIFT-web.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "LIFT $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
